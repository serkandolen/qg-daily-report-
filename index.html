<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />

    <!-- PWA / home-screen icon -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#E0322E" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #0d1117; font-family: "IBM Plex Sans", system-ui, sans-serif; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: linear-gradient(180deg, #0b1f29 0%, #0E4D64 46%, #0d5570 100%);
        color: #fff; transition: opacity .35s ease;
      }
      #boot-splash .bs-logo {
        width: 64px; height: 64px; border-radius: 18px;
        background: linear-gradient(150deg, #FF8A33, #E0322E);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 8px 28px rgba(224,50,46,.45);
      }
      #boot-splash .bs-name { font-size: 24px; font-weight: 800; letter-spacing: -.01em; }
      #boot-splash .bs-spin {
        width: 30px; height: 30px; border-radius: 50%;
        border: 3px solid rgba(255,255,255,.25); border-top-color: #fff;
        animation: bs-rot .8s linear infinite;
      }
      #boot-splash .bs-text { font-size: 13px; color: rgba(255,255,255,.75); }
      @keyframes bs-rot { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-splash">
      <div class="bs-logo">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s5 4 5 9a5 5 0 0 1-10 0c0-2 1-3 1-3s0 2 2 2c0-3 2-5 2-8Z"/></svg>
      </div>
      <div class="bs-name">SECOSYS</div>
      <div class="bs-spin"></div>
      <div class="bs-text">Sayfa yükleniyor / Loading…</div>
    </div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>
