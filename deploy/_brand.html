<body>
<div id="root"></div>
<script>
const MOCK = { Reports:[],Engineering:[],Targets:[],Chat:[], Users:[{name:"Serkan",password:"643844"}], Areas:[], Settings:[] };
const realFetch = window.fetch.bind(window);
window.fetch = async (url) => {
  if(typeof url === "string" && url.includes("script.google.com")){
    const u=new URL(url); const a=u.searchParams.get("action"),t=u.searchParams.get("tab");
    return new Response(JSON.stringify(a==="get"?(MOCK[t]||[]):{ok:true}), { headers:{ "Content-Type":"application/json" } });
  }
  return realFetch(url);
};
(async () => {
  let code = await (await realFetch("main.jsx")).text();
  const out = Babel.transform(code, { presets:["react"], filename:"main.jsx", sourceType:"module" }).code;
  await import(URL.createObjectURL(new Blob([out], { type:"text/javascript" })));
  window.__mounted = true;
})();
</script>
